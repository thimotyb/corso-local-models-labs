# LiteLLM proxy configuration: chat and embedding models are chosen by logical name.
# Start the gateway with:   litellm --config litellm/config.yaml --port 4000
# Clients then use base_url http://localhost:4000/v1 and the names below.
# Check the LiteLLM documentation (https://docs.litellm.ai/) for the current provider prefixes.
model_list:
  - model_name: chat-small
    litellm_params:
      model: ollama_chat/gemma4:e2b
      api_base: http://localhost:11434
  - model_name: chat-large
    litellm_params:
      model: hosted_vllm/Qwen/Qwen3-0.6B   # any model served by vLLM
      api_base: http://localhost:8001/v1
  - model_name: embed-default
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://localhost:11434
